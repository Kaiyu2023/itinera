      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - { $ref: "#/components/parameters/threadId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 10000
      responses:
        "201":
          description: The new comment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/threads/{threadId}/comments/{commentId}/reactions:
    post:
      operationId: setReaction
      tags: [discussions]
      summary: Set whether the caller's reaction is active.
      description: >-
        The caller supplies only an emoji and the desired boolean state. This
        is safe to retry: repeating the same desired state is a no-op. The
        server never accepts another user id.
      x-itinera-roles: [leader, member]
      x-itinera-role-rechecked-in-transaction: true
      x-itinera-idempotent: desired-state
      x-itinera-request-body-limit-bytes: 1024
      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - { $ref: "#/components/parameters/threadId" }
        - { $ref: "#/components/parameters/commentId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [emoji, active]
              properties:
                emoji: { type: string, minLength: 1, maxLength: 16 }
                active: { type: boolean }
      responses:
        "200":
          description: The comment with updated reactions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/ledger:
    get:
      operationId: getLedger
      tags: [ledger]
      summary: The computed ledger — balances and min-cash-flow transfers.
      description: |
        Computed server-side on read; never stored. All derived amounts are in
        the trip base currency. Suggested transfers are the min-cash-flow
        simplification with half units rounded away from zero and the resulting
        whole-unit residual absorbed into the largest-magnitude balance.
      x-itinera-roles: [leader, member, viewer]
      x-itinera-authorization-read: strongly-consistent-direct-membership
      x-itinera-request-body-limit-bytes: 1024
      x-itinera-response-limit-bytes: 4194304
      parameters: [{ $ref: "#/components/parameters/tripId" }]
      responses:
        "200":
          description: The ledger view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/expenses:
    post:
      operationId: addExpense
      tags: [ledger]
      summary: Record an expense — applies immediately (records, not plan edits).
      description: |
        `fxRateToBase` is frozen server-side at entry time. The payer and every
        participant must be current trip members, `exact` split amounts must
        sum to the expense amount in the entry currency, and a linked stop must
        resolve inside the route trip. All validation precedes the write. A
        required `Idempotency-Key` is bound to the canonical request and the
        original server-owned result, so a lost response can be retried without
        recording the charge twice; reusing it for different input conflicts.
      x-itinera-roles: [leader, member]
      x-itinera-role-rechecked-in-transaction: true
      x-itinera-referenced-members-rechecked-in-transaction: true
      x-itinera-request-body-limit-bytes: 65536
      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddExpenseInput" }
      responses:
        "201":
          description: The recorded expense.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/expenses/{expenseId}:
    patch:
      operationId: updateExpense
      tags: [ledger]
      summary: Correct an existing expense and recompute the ledger.
      description: |
        Leaders and members may correct ledger records; viewers are read-only.
        The server checks current membership using the route's `tripId` before
        addressing the expense under that trip, so an opaque expense
        id cannot be used to cross trip boundaries. The patch is applied
        atomically and validated as a complete resulting expense. Changing
        `currency` obtains and freezes a new `fxRateToBase`; every other patch
        preserves the original rate. Client input can never set the rate directly.
      x-itinera-roles: [leader, member]
      x-itinera-role-rechecked-in-transaction: true
      x-itinera-referenced-members-rechecked-in-transaction: true
      x-itinera-request-body-limit-bytes: 65536
      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - name: expenseId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpensePatch" }
      responses:
        "200":
          description: The corrected expense.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteExpense
      tags: [ledger]
      summary: Remove an expense that did not happen.
      description: |
        Leaders and members may remove ledger records; viewers are read-only.
        The server authorizes with the route's `tripId` before addressing the
        expense under that trip, records the authenticated actor in the
        ledger audit trail, and clears any linked stop reference in the same
        transaction. The expense disappears from balances and suggested
        transfers immediately.
      x-itinera-roles: [leader, member]
      x-itinera-role-rechecked-in-transaction: true
      x-itinera-request-body-limit-bytes: 1024
      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - name: expenseId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "204": { description: Expense removed and ledger links reconciled. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/settlements:
    post:
      operationId: addSettlement
      tags: [ledger]
      summary: Record a settlement (amount in trip base currency).
      description: >-
        The sender and recipient must be different current trip members. The
        server records the amount in the trip's base currency and derives all
        balances on read. The required `Idempotency-Key` replays only an exact
        actor-and-request match and conflicts on reuse with different input.
      x-itinera-roles: [leader, member]
      x-itinera-role-rechecked-in-transaction: true
      x-itinera-referenced-members-rechecked-in-transaction: true
      x-itinera-request-body-limit-bytes: 65536
      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddSettlementInput" }
      responses:
        "201":
          description: The recorded settlement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/notices:
    get:
      operationId: listNotices
      tags: [notices]
      summary: Prep notices with their group checklists.
      description: >-
        Every current direct member, including a viewer, may read the complete
        bounded notice collection in the same snapshot as authoritative direct
        membership.
      x-itinera-roles: [leader, member, viewer]
      x-itinera-authorization-read: strongly-consistent-direct-membership
      x-itinera-request-body-limit-bytes: 1024
      x-itinera-response-limit-bytes: 4194304
      parameters: [{ $ref: "#/components/parameters/tripId" }]
      responses:
        "200":
          description: The trip's notices (all statuses; clients filter archived).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createNotice
      tags: [notices]
      summary: Post a notice; checklist rows are plain strings on create.
      description: |
        The server assigns each checklist item an id, an empty `doneBy`, and
        `mode: each` — completion is something the group does later, not
        something pre-set when posting. Only current leaders and members may
        create notices. Every explicit audience id must be a current direct
        member. The server validates those direct memberships again in the same
        atomic creation transaction, so a concurrent membership change fails
        closed. A required `Idempotency-Key` is valid for 24 hours in an
        actor-scoped namespace bounded to 32 claims per trip. An exact retry
        returns the notice's current representation, so a later authorized edit
        is visible on replay.
      x-itinera-roles: [leader, member]
      x-itinera-role-rechecked-in-transaction: true
      x-itinera-idempotency-scope: actor-trip
      x-itinera-idempotency-ttl-seconds: 86400
      x-itinera-idempotency-max-claims: 32
      x-itinera-idempotency-replay: current-resource
      x-itinera-request-body-limit-bytes: 65536
      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNoticeInput" }
      responses:
        "201":
          description: The created notice, or its current representation on exact replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/notices/{noticeId}/checklist/{itemId}/toggle:
    post:
      operationId: toggleChecklistItem
      tags: [notices]
      summary: Toggle the caller's tick on a checklist item.
      description: |
        `each`-mode items track per-person ticks (`doneBy` gains/loses the
        caller). `group`-mode items are done once `doneBy` is non-empty,
        stamped with whoever did it. The request has no body and can identify
        no user: the authenticated caller may change only their own state and
        only when they belong to the notice audience. This narrow personal
        acknowledgement is also available to viewers; it does not grant notice
        content-management rights. A required `Idempotency-Key` is valid for 24
        hours in an actor-scoped namespace bounded to 32 claims per trip. An
        exact retry does not toggle a second time and returns the notice's
        current representation.
      x-itinera-roles: [leader, member, viewer]
      x-itinera-caller-owned: true
      x-itinera-role-rechecked-in-transaction: true
      x-itinera-idempotency-scope: actor-trip
      x-itinera-idempotency-ttl-seconds: 86400
      x-itinera-idempotency-max-claims: 32
      x-itinera-idempotency-replay: current-resource
      x-itinera-request-body-limit-bytes: 1024
      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - { $ref: "#/components/parameters/noticeId" }
        - { $ref: "#/components/parameters/idempotencyKey" }
        - name: itemId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: The notice with the updated checklist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/service-identities:
    get:
      operationId: listServiceIdentities
      tags: [service-identities]
      summary: The human caller's Cloudflare Access service mappings.
      x-itinera-principal: human-only
      responses:
        "200":
          description: All mappings, including revoked or expired identities.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { $ref: "#/components/schemas/ServiceIdentity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: registerServiceIdentity
      tags: [service-identities]
      summary: Map an externally created, specifically admitted Cloudflare service token.
      description: >-
        The caller supplies the Cloudflare service-token client ID (`common_name`),
        never its client secret. Itinera stores only a SHA-256 digest plus a short
        recognition hint. A `propose` mapping requires the owner to be a current
        leader/member of every scoped trip; `read` accepts every direct role.
      x-itinera-principal: human-only
      x-itinera-authorization-write: strongly-consistent-direct-membership-in-transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterServiceIdentityInput" }
      responses:
        "201":
          description: The registered mapping. No credential secret is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceIdentity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/service-identities/{serviceIdentityId}:
    delete:
      operationId: revokeServiceIdentity
      tags: [service-identities]
      summary: Revoke a mapping immediately and idempotently.
      x-itinera-principal: human-only
      x-itinera-idempotent: true
      parameters:
        - name: serviceIdentityId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "204": { description: Service identity revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    cfAccessJwt:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: >-
        A signed Cloudflare Access application JWT. Human assertions carry a
        canonical email. Specifically admitted service-token assertions carry a
        mapped `common_name`; the mapping supplies owner, trip IDs, scopes,
        expiry, revocation, and a 300-request-per-UTC-hour application limit.

  parameters:
    tripId:
      name: tripId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-generated operation key. It is hashed before persistence and is
        bound to the authenticated actor, route trip, canonical request, and
        server-owned operation result. Each operation documents whether replay
        returns the original snapshot or the current referenced resource.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    editId:
      name: editId
      in: path
      required: true
      description: Server-issued content audit id; never an entity or field selector.
      schema: { type: string, minLength: 1, maxLength: 200 }
    proposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    pollId:
      name: pollId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    threadId:
      name: threadId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    commentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    noticeId:
      name: noticeId
      in: path
      required: true
      schema: { type: string }
    reviewItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No valid human or mapped-service Cloudflare Access assertion.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but the human role or service scope does not permit the operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource, or not visible to the caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State conflict (e.g. stale basePlanVersion, poll not open).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: The mapped service identity exhausted its current UTC-hour request allowance.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: A required storage or provider dependency is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalServerError:
      description: Stored data failed closed validation or an internal invariant failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The request body exceeds the route's explicit safety limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          {
            type: string,
            description: "Machine-readable code, e.g. stale_change_set.",
          }
        message: { type: string, description: Human-readable explanation. }
    # --- Users & membership --------------------------------------------------

    User:
      type: object
      required: [id, email, displayName, avatarColor]
      properties:
        id: { type: string }
        email: { type: string, format: email, maxLength: 320 }
        displayName: { type: string }
        avatarColor:
          { type: string, description: "UI-assigned; stable per user." }

    TripRole:
      type: string
      enum: [leader, member, viewer]

    TripMember:
      type: object
      required: [userId, role, joinedAt]
      properties:
        userId: { type: string }
        role: { $ref: "#/components/schemas/TripRole" }
        joinedAt: { type: string, format: date-time }

    Invite:
      type: object
      required: [id, tripId, email, invitedBy, status, createdAt]
      properties:
        id: { type: string }
        tripId: { type: string }
        email: { type: string, format: email, maxLength: 320 }
        invitedBy: { type: string, description: userId }
        status: { type: string, enum: [pending, accepted] }
        createdAt: { type: string, format: date-time }

    # --- Places & candidates -------------------------------------------------

    PlaceKind:
      type: string
      enum: [sight, food, lodging, activity, transport_hub]

    PlaceActivityIdea:
      type: object
      description: >-
        One optional activity from the reusable place guide. This is a pool
        entry, not a commitment or a selected itinerary item.
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
          description: Short label shown in compact guide surfaces.
        details:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Optional explanatory copy revealed on demand. Omit when the title
            is self-explanatory; clients must not synthesize placeholder text.

    PlaceGuide:
      type: object
      description: >-
        Provider-independent place context. Catalog entries may carry
        app-curated copy; candidate-owned place snapshots may carry member-
        authored copy. Trip-specific recommendation rationale remains on
        Candidate.pitch. Guide strings are stored content, not UI message-
        catalogue keys, and are returned unchanged regardless of the client's
        interface locale.
      required: [summary, intro, activityIdeas, practicalTips]
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 500
          description: Card-length orientation, normally one or two lines.
        intro:
          type: string
          minLength: 1
          maxLength: 4000
          description: Longer introduction for an expanded place panel.
        activityIdeas:
          type: array
          maxItems: 20
          description: Optional activities the group may pick from; not a checklist.
          items: { $ref: "#/components/schemas/PlaceActivityIdea" }
        practicalTips:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 500 }

    Place:
      type: object
      required:
        [
          id,
          name,
          kind,
          lat,
          lng,
          tz,
          countryCode,
          adminArea,
          city,
          address,
          externalRef,
          website,
          phone,
          rating,
          priceLevel,
          openingHours,
          photoUrls,
          guide,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/PlaceKind" }
        lat: { type: number }
        lng: { type: number }
        tz: { type: string, description: IANA timezone. }
        countryCode: { type: string, description: ISO 3166-1 alpha-2. }
        adminArea: { type: string }
        city: { type: string }
        address: { type: string }
        externalRef:
          description: Provider-agnostic pointer into the source catalog (PlaceCatalog port).
          oneOf:
            - type: "null"
            - type: object
              required: [provider, placeId]
              properties:
                provider: { type: string }
                placeId: { type: string }
        website: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        rating: { type: [number, "null"], minimum: 0, maximum: 5 }
        priceLevel: { type: [integer, "null"], minimum: 1, maximum: 4 }
        openingHours:
          description: Cached provider JSON; UI treats it as display-only.
          oneOf:
            - type: "null"
            - type: object
              required: [weekdayText]
              properties:
                weekdayText:
                  type: array
                  items: { type: string }
        photoUrls:
          type: array
          items: { type: string }
          description: R2 keys in prod; any URL in fixtures.
        guide:
          description: Null for catalog or manually entered places without editorial enrichment.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PlaceGuide"

    CandidateStatus:
      type: string
      enum: [shortlisted, in_plan, rejected]

    CandidateDisposition:
      type: string
      enum: [shortlisted, rejected]
      description: Candidate states a member may choose directly; `in_plan` is proposal-owned.

    Candidate:
      type: object
      required:
        [
          id,
          tripId,
          sourcePlaceId,
          placeId,
          proposedBy,
          createdAt,
          pitch,
          tags,
          status,
        ]
      properties:
        id: { type: string }
        tripId: { type: string }
        sourcePlaceId:
          type: [string, "null"]
          description: Immutable catalog/plan source; null for a manually entered idea.
        placeId:
          type: string
          description: Candidate-owned editable place snapshot.
        proposedBy: { type: string, description: userId }
        createdAt: { type: string, format: date-time }
        pitch: { type: string }
        tags:
          type: array
          items: { type: string }
        status: { $ref: "#/components/schemas/CandidateStatus" }

    CandidateWithPlace:
      description: Candidates are always served with their place joined in — no N+1 fetches.
      allOf:
        - $ref: "#/components/schemas/Candidate"
        - type: object
          required: [place]
          properties:
            place: { $ref: "#/components/schemas/Place" }

    # --- Trip → Plan → Day → Stop ---------------------------------------------

    TripStatus:
      type: string
      enum: [dreaming, planning, booked, ongoing, done]

    Trip:
      type: object
      required:
        [
          id,
          name,
          coverPhotoUrl,
          accentColor,
          stopKindLabels,
          status,
          startDate,
          endDate,
          baseCurrency,
          members,
          currentPlanId,
          createdAt,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        coverPhotoUrl: { type: [string, "null"] }
        accentColor:
          type: [string, "null"]
          description: >-
            Per-trip theme accent (CSS color), leader-settable. App chrome stays
            neutral — only trip surfaces pick this up.
        stopKindLabels:
          description: >-
            Leader-customisable display labels for stop kinds (e.g. rename
            "activity" to "onsen"). Missing keys fall back to built-in names.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: { type: string }
              propertyNames:
                enum: [visit, meal, lodging, activity, transit]
        status: { $ref: "#/components/schemas/TripStatus" }
        startDate: { type: string, format: date }
        endDate:
          type: string
          format: date
          description: On or after startDate; the inclusive trip may contain at most 90 days.
        baseCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217.
        softBudget:
          description: >-
            Optional per-person soft spending cap (leader-settable). Never
            blocks a spend — the Ledger colours its budget bar toward amber as
            the group total approaches amount × members. Absent/null hides the
            bar. Any currency; converted to trip base for the comparison.
          oneOf:
            - type: "null"
            - type: object
              required: [amount, currency]
              properties:
                amount: { type: number }
                currency: { type: string }
        members:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/TripMember" }
        currentPlanId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    TripSummary:
      description: Card-sized projection for the trip list.
      type: object
      required:
        [
          id,
          name,
          coverPhotoUrl,
          accentColor,
          status,
          startDate,
          endDate,
          memberCount,
          cities,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        coverPhotoUrl: { type: [string, "null"] }
        accentColor: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TripStatus" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        memberCount: { type: integer, minimum: 1, maximum: 1000 }
        cities:
          type: array
          items: { type: string }
          description: Derived from the current plan, for the card subtitle.

    Plan:
      type: object
      required: [id, tripId, version, createdFromProposalId, createdAt]
      properties:
        id: { type: string }
        tripId: { type: string }
        version: { type: integer }
        createdFromProposalId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    Day:
      type: object
      required: [id, planId, date, cityHint, tz, windowStart, windowEnd]
      properties:
        id: { type: string }
        planId: { type: string }
        date: { type: string, format: date }
        cityHint: { type: string }
        tz: { type: string, description: IANA timezone. }
        windowStart:
          { type: string, description: '"HH:MM" local — feasibility budget.' }
        windowEnd: { type: string, description: '"HH:MM" local.' }

    StopKind:
      type: string
      enum: [visit, meal, lodging, activity, transit]

    Booking:
      type: object
      additionalProperties: false
      required: [ref, url, cost, ledgerEntryId]
      properties:
        ref: { type: string, minLength: 1, maxLength: 200 }
        url:
          type: [string, "null"]
          format: uri
          pattern: "^https?://"
          maxLength: 2048
          description: HTTP(S) only; active-content schemes are rejected.
        cost:
          oneOf:
            - type: "null"
            - type: object
              required: [amount, currency]
              properties:
                amount: { type: number, minimum: 0 }
                currency:
                  type: string
                  pattern: "^[A-Za-z]{3}$"
                  description: ISO 4217; the server normalises it to uppercase.
        ledgerEntryId:
          type: [string, "null"]
          maxLength: 200
          readOnly: true
          description: Server-owned ledger link; only ledger transactions may change it.

    BookingInput:
      type: object
      additionalProperties: false
      required: [ref, url, cost]
      properties:
        ref: { type: string, minLength: 1, maxLength: 200 }
        url:
          type: [string, "null"]
          format: uri
          pattern: "^https?://"
          maxLength: 2048
        cost:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [amount, currency]
              properties:
                amount: { type: number, minimum: 0 }
                currency: { type: string, pattern: "^[A-Za-z]{3}$" }

    Stop:
      type: object
      required:
        [
          id,
          dayId,
          seq,
          placeId,
          stopKind,
          plannedArrival,
          durationMin,
          booking,
          notes,
        ]
      properties:
        id: { type: string }
        dayId: { type: string }
        seq: { type: number, description: Order within the day. }
        placeId: { type: string }
        stopKind: { $ref: "#/components/schemas/StopKind" }
        plannedArrival: { type: string, description: '"HH:MM" local.' }
        durationMin: { type: integer }
        booking:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Booking"
        notes: { type: string }

    TravelMode:
      type: string
      enum: [walk, transit, drive, flight]

    Feasibility:
      type: string
      enum: [ok, tight, unreasonable, impossible]

    Leg:
      description: Computed + cached by the RoutingEngine; never user-edited.
      type: object
      required:
        [
          fromStopId,
          toStopId,
          mode,
          distanceM,
          durationMin,
          feasibility,
          feasibilityNote,
          providerSnapshotAt,
        ]
      properties:
        fromStopId: { type: string }
        toStopId: { type: string }
        mode: { $ref: "#/components/schemas/TravelMode" }
        distanceM: { type: number }
        durationMin: { type: integer }
        feasibility: { $ref: "#/components/schemas/Feasibility" }
        feasibilityNote:
          type: [string, "null"]
          description: Human-readable reason when feasibility is not `ok`.
        providerSnapshotAt: { type: string, format: date-time }

    DayFeasibility:
      description: Per-day verdict from the feasibility engine (§5).
      type: object
      required: [dayId, feasibility, usedMin, windowMin, notes]
      properties:
        dayId: { type: string }
        feasibility: { $ref: "#/components/schemas/Feasibility" }
        usedMin: { type: integer, description: Visits + legs. }
        windowMin: { type: integer }
        notes:
          type: array
          items: { type: string }

    PlanDetail:
      description: Everything needed to render the map + timeline in one fetch.
      type: object
      required: [plan, days, stops, legs, dayFeasibility, places]
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        days:
          type: array
          items: { $ref: "#/components/schemas/Day" }
        stops:
          type: array
          items: { $ref: "#/components/schemas/Stop" }
        legs:
          type: array
          items: { $ref: "#/components/schemas/Leg" }
        dayFeasibility:
          type: array
          items: { $ref: "#/components/schemas/DayFeasibility" }
        places:
          type: array
          items: { $ref: "#/components/schemas/Place" }
          description: Every place referenced by stops.
    # --- Change management (§3.3) ---------------------------------------------

    NewPlaceDraft:
      description: >-
        A place proposed from scratch in the add-stop composer's "Somewhere
        new" mode. On apply the backend materialises it into a trip-owned Place.
        Supplied coordinates are preserved; until provider/geocoding integration
        lands, an unlocated hand-typed place uses explicit neutral coordinates
        rather than invented geography. Only these human-entered fields cross
        the wire.
      type: object
      additionalProperties: false
      x-itinera-coordinate-pair: Both lat and lng must be present, or both must be null.
      required: [name, kind, city, note, url, lat, lng]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: "#/components/schemas/PlaceKind" }
        city: { type: string, minLength: 1, maxLength: 120 }
        note:
          {
            type: string,
            maxLength: 10000,
            description: "Seeds the new stop's notes; '' when omitted.",
          }
        url:
          {
            type: [string, "null"],
            maxLength: 2048,
            pattern: "^https?://",
            description: Google-Maps / website link.,
          }
        lat:
          type: [number, "null"]
          minimum: -90
          maximum: 90
          description: >-
            Set when the drafter picked the spot off the map / search catalog;
            null for a hand-typed place that is not yet geocoded.
        lng: { type: [number, "null"], minimum: -180, maximum: 180 }

    ChangeOp:
      description: One structural operation. Discriminated by `op`.
      oneOf:
        - title: add_stop
          type: object
          additionalProperties: false
          required: [op, dayId, placeId, seq, stopKind]
          properties:
            op: { const: add_stop }
            dayId: { type: string, minLength: 1, maxLength: 200 }
            placeId: { type: string, minLength: 1, maxLength: 200 }
            seq: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
            stopKind: { $ref: "#/components/schemas/StopKind" }
        - title: add_place_stop
          description: >-
            Add a brand-new place AND its stop in one op. Unlike add_stop
            (which references an existing catalog place by id), the place does
            not exist yet — `draft` is materialised into a Place on apply,
            then the stop is inserted.
          type: object
          additionalProperties: false
          required: [op, dayId, seq, stopKind, draft]
          properties:
            op: { const: add_place_stop }
            dayId: { type: string, minLength: 1, maxLength: 200 }
            seq: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
            stopKind: { $ref: "#/components/schemas/StopKind" }
            draft: { $ref: "#/components/schemas/NewPlaceDraft" }
        - title: remove_stop
          type: object
          additionalProperties: false
          required: [op, stopId]
          properties:
            op: { const: remove_stop }
            stopId: { type: string, minLength: 1, maxLength: 200 }
        - title: move_stop
          type: object
          additionalProperties: false
          required: [op, stopId, toDayId, seq]
          properties:
            op: { const: move_stop }
            stopId: { type: string, minLength: 1, maxLength: 200 }
            toDayId: { type: string, minLength: 1, maxLength: 200 }
            seq: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        - title: reorder
          type: object
          additionalProperties: false
          required: [op, dayId, stopIdsInOrder]
          properties:
            op: { const: reorder }
            dayId: { type: string, minLength: 1, maxLength: 200 }
            stopIdsInOrder:
              type: array
              minItems: 1
              maxItems: 50
              items: { type: string, minLength: 1, maxLength: 200 }
              description: Every stop currently on the day, exactly once.
        - title: swap_place
          type: object
          additionalProperties: false
          required: [op, stopId, newPlaceId]
          properties:
            op: { const: swap_place }
            stopId: { type: string, minLength: 1, maxLength: 200 }
            newPlaceId: { type: string, minLength: 1, maxLength: 200 }
        - title: add_day
          type: object
          additionalProperties: false
          required: [op, date, cityHint]
          properties:
            op: { const: add_day }
            date: { type: string, format: date }
            cityHint: { type: string, minLength: 1, maxLength: 120 }
        - title: remove_day
          type: object
          additionalProperties: false
          required: [op, dayId]
          properties:
            op: { const: remove_day }
            dayId: { type: string, minLength: 1, maxLength: 200 }

    ChangeSet:
      type: object
      additionalProperties: false
      description: >-
        Operations are validated in order against the live base plan. Every
        referenced day, stop, and private place must resolve inside the route
        trip (catalog places are public), and the complete command is
        preflighted before any proposal or plan data is written. Resulting days
        must retain unique calendar dates.
      required: [basePlanVersion, ops]
      properties:
        basePlanVersion:
          type: integer
          minimum: 1
          description: The plan version the ops were authored against; a mismatch on apply is a 409 (`stale`).
        ops:
          type: array
          items: { $ref: "#/components/schemas/ChangeOp" }
          minItems: 1
          maxItems: 20

    ChangeSource:
      description: "Where a change came from: the web UI, or a mapped Cloudflare service identity."
      oneOf:
        - title: web
          type: object
          additionalProperties: false
          required: [via]
          properties:
            via: { const: web }
        - title: service
          type: object
          additionalProperties: false
          required: [via, serviceIdentityId, serviceIdentityName]
          properties:
            via: { const: service }
            serviceIdentityId: { type: string }
            serviceIdentityName: { type: string }

    ProposalRoute:
      type: string
      enum: [leader_approval, poll]

    ProposalStatus:
      type: string
      enum: [draft, pending, approved, rejected, applied, stale]

    Proposal:
      type: object
      additionalProperties: false
      required:
        [
          id,
          tripId,
          createdBy,
          source,
          title,
          rationale,
          changeSet,
          route,
          status,
          decidedBy,
          rejectionReason,
          createdAt,
        ]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        tripId: { type: string, minLength: 1, maxLength: 200 }
        createdBy:
          {
            type: string,
            minLength: 1,
            maxLength: 200,
            description: userId (service owner when source is a service identity).
          }
        source: { $ref: "#/components/schemas/ChangeSource" }
        title: { type: string, minLength: 1, maxLength: 200 }
        rationale: { type: string, maxLength: 4000 }
        changeSet: { $ref: "#/components/schemas/ChangeSet" }
        route: { $ref: "#/components/schemas/ProposalRoute" }
        status: { $ref: "#/components/schemas/ProposalStatus" }
        decidedBy:
          oneOf:
            - type: "null"
            - title: leader
              type: object
              additionalProperties: false
              required: [kind, userId]
              properties:
                kind: { const: leader }
                userId: { type: string, minLength: 1, maxLength: 200 }
            - title: poll
              type: object
              additionalProperties: false
              required: [kind, pollId]
              properties:
                kind: { const: poll }
                pollId: { type: string, minLength: 1, maxLength: 200 }
        rejectionReason:
          type: [string, "null"]
          maxLength: 2000
          description: Set when a leader rejects — required, shown to the proposer (§3.3).
        createdAt: { type: string, format: date-time }

    # --- Polls -----------------------------------------------------------------

    PollKind:
      type: string
      enum: [decision, plan_change]

    PollStatus:
      description: >-
        Lifecycle: draft (being written, no votes counted) → scheduled
        (auto-opens at opensAt) → open → passed | failed | expired. A poll that
        closes below quorum is expired; at/above quorum it is passed/failed. A
        tied top result is failed with no decision. A plan-change poll whose
        winning proposal has a stale base plan also fails without applying it.
      type: string
      enum: [draft, scheduled, open, passed, failed, expired]

    PollOption:
      type: object
      additionalProperties: false
      required: [id, label, proposalId]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        label: { type: string, minLength: 1, maxLength: 200 }
        proposalId:
          type: [string, "null"]
          maxLength: 200
          description: Set for plan_change polls.

    PollVote:
      type: object
      additionalProperties: false
      required: [userId, optionId, at]
      properties:
        userId: { type: string, minLength: 1, maxLength: 200 }
        optionId: { type: string, minLength: 1, maxLength: 200 }
        at: { type: string, format: date-time }

    Poll:
      type: object
      additionalProperties: false
      required:
        [
          id,
          tripId,
          createdBy,
          kind,
          title,
          description,
          options,
          opensAt,
          closesAt,
          quorum,
          allowMulti,
          status,
          votes,
          resolutionNote,
        ]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        tripId: { type: string, minLength: 1, maxLength: 200 }
        createdBy: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: "#/components/schemas/PollKind" }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        options:
          type: array
          minItems: 2
          maxItems: 6
          items: { $ref: "#/components/schemas/PollOption" }
        opensAt:
          type: [string, "null"]
          format: date-time
          description: When a scheduled poll auto-opens; null for polls that open immediately.
        closesAt:
          type: string
          format: date-time
          pattern: "(Z|[+-]00:00)$"
          description: UTC instant; non-zero offsets are rejected.
        decidedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            When voting actually stopped. Optional for records written before
            this field existed; null while the poll is not decided.
        quorum: { type: integer, minimum: 1, maximum: 1000 }
        allowMulti: { type: boolean }
        status: { $ref: "#/components/schemas/PollStatus" }
        votes:
          type: array
          maxItems: 6000
          items: { $ref: "#/components/schemas/PollVote" }
        resolutionNote:
          type: [string, "null"]
          maxLength: 2000
          description: How a below-quorum / off-poll decision was ultimately made (§3.3).

    # --- Edits & review (§3.3, §7) ---------------------------------------------

    EditEntity:
      type: string
      enum: [stop, day, candidate, notice, trip]

    EditStatus:
      type: string
      enum: [applied, pending_review, rejected, reverted]

    Edit:
      description: Field-level, revertible history for content edits.
      type: object
      additionalProperties: false
      required:
        [
          id,
          tripId,
          entity,
          entityId,
          field,
          oldValue,
          newValue,
          author,
          source,
          status,
          createdAt,
          revertedBy,
          revertedAt,
          revertEditId,
          revertsEditId,
        ]
      properties:
        id: { type: string }
        tripId: { type: string }
        entity: { $ref: "#/components/schemas/EditEntity" }
        entityId: { type: string }
        field: { type: string }
        oldValue: { description: Any JSON value (the field's previous state). }
        newValue: { description: Any JSON value (the field's new state). }
        author: { type: string, description: userId }
        source: { $ref: "#/components/schemas/ChangeSource" }
        status: { $ref: "#/components/schemas/EditStatus" }
        createdAt: { type: string, format: date-time }
        revertedBy:
          type: [string, "null"]
          description: Authenticated user who reverted this edit; null unless status is reverted.
        revertedAt:
          type: [string, "null"]
          format: date-time
          description: Commit time of the successful revert; null unless status is reverted.
        revertEditId:
          type: [string, "null"]
          description: Compensating edit created by this edit's revert.
        revertsEditId:
          type: [string, "null"]
          description: Original edit compensated by this row; null for an ordinary edit.

    ContentHistoryEdit:
      description: An applied or reverted content edit visible in shared trip history.
      allOf:
        - { $ref: "#/components/schemas/Edit" }
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [applied, reverted] }

    ReviewItem:
      description: An item awaiting the service owner's approval — the AI airlock (§7). Discriminated by `kind`.
      oneOf:
        - title: edit
          type: object
          required: [id, kind, edit]
          properties:
            id: { type: string }
            kind: { const: edit }
            edit: { $ref: "#/components/schemas/Edit" }
        - title: proposal
          type: object
          required: [id, kind, proposal]
          properties:
            id: { type: string }
            kind: { const: proposal }
            proposal: { $ref: "#/components/schemas/Proposal" }
        - title: candidate
          type: object
          required: [id, kind, candidate, place]
          properties:
            id: { type: string }
            kind: { const: candidate }
            candidate: { $ref: "#/components/schemas/Candidate" }
            place: { $ref: "#/components/schemas/Place" }
        - title: comment
          type: object
          required: [id, kind, tripId, comment, threadTitle]
          properties:
            id: { type: string }
            kind: { const: comment }
            tripId:
              {
                type: string,
                description: Trip context used to resolve the discussion and reviewers.,
              }
            comment: { $ref: "#/components/schemas/Comment" }
            threadTitle: { type: string }

    # --- Discussions (§3.4) ------------------------------------------------------

    ThreadAnchor:
      description: What the thread hangs off. Discriminated by `kind`.
      oneOf:
        - title: trip
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { const: trip }
        - title: day
          type: object
          additionalProperties: false
          required: [kind, dayId]
          properties:
            kind: { const: day }
            dayId: { type: string, minLength: 1, maxLength: 200 }
        - title: stop
          type: object
          additionalProperties: false
          required: [kind, stopId]
          properties:
            kind: { const: stop }
            stopId: { type: string, minLength: 1, maxLength: 200 }
        - title: poll
          type: object
          additionalProperties: false
          required: [kind, pollId]
          properties:
            kind: { const: poll }
            pollId: { type: string, minLength: 1, maxLength: 200 }
        - title: candidate
          type: object
          additionalProperties: false
          required: [kind, candidateId]
          properties:
            kind: { const: candidate }
            candidateId: { type: string, minLength: 1, maxLength: 200 }

    Thread:
      type: object
      additionalProperties: false
      required: [id, tripId, anchor, title, commentCount, lastActivityAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        tripId: { type: string, minLength: 1, maxLength: 200 }
        anchor: { $ref: "#/components/schemas/ThreadAnchor" }
        title: { type: string, minLength: 1, maxLength: 200 }
        commentCount: { type: integer, minimum: 1, maximum: 1000 }
        lastActivityAt:
          type: string
          format: date-time
          pattern: "(Z|[+-]00:00)$"
          description: UTC instant; non-zero offsets are rejected.

    CreateThreadInput:
      type: object
      additionalProperties: false
      required: [anchor, title, body]
      properties:
        anchor: { $ref: "#/components/schemas/ThreadAnchor" }
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Usually the anchored entity's display name.
        body:
          type: string
          minLength: 1
          maxLength: 10000
          description: The first comment, markdown.

    Comment:
      type: object
      additionalProperties: false
      required: [id, threadId, author, body, createdAt, reactions]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        threadId: { type: string, minLength: 1, maxLength: 200 }
        author: { type: string, minLength: 1, maxLength: 200, description: userId }
        body: { type: string, minLength: 1, maxLength: 10000, description: Markdown. }
        createdAt:
          type: string
          format: date-time
          pattern: "(Z|[+-]00:00)$"
          description: UTC instant; non-zero offsets are rejected.
        reactions:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [emoji, userIds]
            properties:
              emoji: { type: string, minLength: 1, maxLength: 16 }
              userIds:
                type: array
                minItems: 1
                maxItems: 1000
                uniqueItems: true
                items: { type: string, minLength: 1, maxLength: 200 }
    # --- Ledger (§3.5) -----------------------------------------------------------

    ExpenseCategory:
      type: string
      enum: [lodging, food, transport, tickets, other]

    ExpenseSplit:
      description: How an expense divides. Discriminated by `kind`.
      oneOf:
        - title: even
          type: object
          additionalProperties: false
          required: [kind, participantIds]
          properties:
            kind: { const: even }
            participantIds:
              type: array
              items: { type: string, minLength: 1, maxLength: 200 }
              minItems: 1
              maxItems: 50
              uniqueItems: true
        - title: shares
          description: Weighted split — kept for API/AI callers; the web UI offers even and exact.
          type: object
          additionalProperties: false
          required: [kind, participants]
          properties:
            kind: { const: shares }
            participants:
              type: array
              minItems: 1
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required: [userId, weight]
                properties:
                  userId: { type: string, minLength: 1, maxLength: 200 }
                  weight:
                    { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
        - title: exact
          description: Per-head amounts in the entry currency; must sum to the expense amount.
          type: object
          additionalProperties: false
          required: [kind, participants]
          properties:
            kind: { const: exact }
            participants:
              type: array
              minItems: 1
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required: [userId, amount]
                properties:
                  userId: { type: string, minLength: 1, maxLength: 200 }
                  amount: { type: number, minimum: 0, maximum: 1000000000 }

    Expense:
      type: object
      additionalProperties: false
      required:
        [
          id,
          tripId,
          paidBy,
          amount,
          currency,
          fxRateToBase,
          category,
          split,
          note,
          receiptPhotoUrl,
          linkedStopId,
          createdAt,
        ]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        tripId: { type: string, minLength: 1, maxLength: 200 }
        paidBy:
          { type: string, minLength: 1, maxLength: 200, description: userId }
        amount:
          {
            type: number,
            exclusiveMinimum: 0,
            maximum: 1000000000,
            description: In `currency`.,
          }
        currency:
          { type: string, pattern: "^[A-Z]{3}$", description: ISO 4217. }
        fxRateToBase:
          {
            type: number,
            exclusiveMinimum: 0,
            maximum: 1000000,
            description: Frozen at entry time.,
          }
        category: { $ref: "#/components/schemas/ExpenseCategory" }
        split: { $ref: "#/components/schemas/ExpenseSplit" }
        note: { type: string, maxLength: 10000 }
        receiptPhotoUrl:
          { type: [string, "null"], pattern: "^https?://" }
        linkedStopId:
          { type: [string, "null"], minLength: 1, maxLength: 200 }
        createdAt:
          { type: string, format: date-time, pattern: "(Z|[+-]00:00)$" }

    Settlement:
      type: object
      additionalProperties: false
      required: [id, tripId, fromUser, toUser, amount, settledAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        tripId: { type: string, minLength: 1, maxLength: 200 }
        fromUser: { type: string, minLength: 1, maxLength: 200 }
        toUser: { type: string, minLength: 1, maxLength: 200 }
        amount:
          {
            type: number,
            exclusiveMinimum: 0,
            maximum: 1000000000,
            description: In trip base currency.,
          }
        settledAt:
          { type: string, format: date-time, pattern: "(Z|[+-]00:00)$" }

    LedgerView:
      description: >-
        Computed server-side; never stored. All amounts are in trip base
        currency. Decimal and whole-unit half ties round away from zero.
      type: object
      additionalProperties: false
      required: [expenses, settlements, balances, suggestedTransfers]
      properties:
        expenses:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/Expense" }
        settlements:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/Settlement" }
        balances:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [userId, paid, owed, net]
            properties:
              userId: { type: string }
              paid: { type: number }
              owed: { type: number }
              net: { type: number }
        suggestedTransfers:
          description: "Min-cash-flow simplification: who should pay whom to zero out."
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [fromUser, toUser, amount]
            properties:
              fromUser: { type: string }
              toUser: { type: string }
              amount: { type: number }

    # --- Notices (§3.6) -----------------------------------------------------------

    NoticeCategory:
      type: string
      enum: [visa, safety, health, money, connectivity, packing, custom]

    ChecklistItem:
      type: object
      additionalProperties: false
      required: [id, text, doneBy]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        text: { type: string, minLength: 1, maxLength: 500 }
        doneBy:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: string }
          description: userIds — per-person checkable.
        dueDate:
          type: string
          format: date
          description: >-
            Structured deadline the "what's still open" roll-up sorts and
            badges by. Optional — items without one never badge as "soon".
        mode:
          type: string
          enum: [each, group]
          default: each
          description: >-
            each: every member ticks individually (coverage is "n / members").
            group: one shared task, done once doneBy is non-empty, stamped
            with whoever did it; only that member may clear the stamp.

    Notice:
      type: object
      additionalProperties: false
      required:
        [
          id,
          tripId,
          createdBy,
          category,
          title,
          body,
          sourceUrl,
          pinned,
          checklistItems,
        ]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        tripId: { type: string, minLength: 1, maxLength: 200 }
        createdBy:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            UserId of the author. A current leader may manage the notice; its
            author may manage it only while they remain a current leader or member.
        category: { $ref: "#/components/schemas/NoticeCategory" }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 10000, description: Markdown. }
        sourceUrl:
          type: [string, "null"]
          maxLength: 2048
          pattern: "^https?://"
        pinned: { type: boolean }
        status:
          type: string
          enum: [active, resolved, archived]
          default: active
          description: >-
            resolved notices grey out and sink below active ones; archived
            ones leave the visible list (kept in history).
        audience:
          type: [array, "null"]
          minItems: 1
          maxItems: 90
          uniqueItems: true
          items: { type: string }
          description: >-
            Member userIds this notice concerns. Absent or null = the whole
            group. Everyone can read the notice, but checklist obligations,
            progress denominators, and personal open counts apply only to
            the audience.
        checklistItems:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ChecklistItem" }

    # --- Cloudflare Access service identities (§7) ---------------------------------

    ServiceScope:
      type: string
      enum: [read, propose]

    ServiceIdentity:
      type: object
      additionalProperties: false
      required:
        [id, name, clientIdHint, scopes, tripIds, expiresAt, lastUsedAt, revokedAt, createdAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 80 }
        clientIdHint:
          type: string
          minLength: 1
          maxLength: 16
          description: Short recognition hint; the complete client ID and secret are never returned.
        scopes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: "#/components/schemas/ServiceScope" }
        tripIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    # --- Input shapes -----------------------------------------------------------

    CreateTripInput:
      type: object
      additionalProperties: false
      required: [name, startDate, endDate, baseCurrency]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        startDate: { type: string, format: date }
        endDate:
          type: string
          format: date
          description: On or after startDate; the inclusive trip may contain at most 90 days.
        baseCurrency:
          type: string
          pattern: "^[A-Za-z]{3}$"
          description: ISO 4217; the server normalises it to uppercase.

    InitializePlanInput:
      type: object
      additionalProperties: false
      description: >-
        The shortlisted candidate place that supplies the initial Day city and
        IANA timezone. The place must belong to a shortlisted idea on this trip.
      required: [anchorPlaceId]
      properties:
        anchorPlaceId: { type: string, minLength: 1, maxLength: 200 }

    CandidatePlaceInput:
      type: object
      additionalProperties: false
      description: >-
        Human-authored fields of a candidate-owned place snapshot. Provider
        identity, coordinates, timezone, country, rating, and price are
        inherited only from an explicit sourcePlaceId and cannot be rewritten
        by this form. With a null sourcePlaceId no provider identity is guessed
        from the city name; coordinates remain neutral and the timezone remains
        UTC until the step 4 catalog/geocoding integration resolves them.
      required:
        [
          name,
          kind,
          city,
          address,
          website,
          phone,
          openingHours,
          photoUrls,
          guide,
        ]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: "#/components/schemas/PlaceKind" }
        city: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, maxLength: 500 }
        website:
          type: [string, "null"]
          format: uri
          pattern: "^https?://"
          maxLength: 2048
          description: HTTP(S) only; active-content schemes are rejected.
        phone: { type: [string, "null"], maxLength: 80 }
        openingHours:
          type: array
          maxItems: 14
          items: { type: string, minLength: 1, maxLength: 200 }
        photoUrls:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 2048 }
        guide:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PlaceGuide"

    AddCandidateInput:
      type: object
      additionalProperties: false
      required: [sourcePlaceId, place, pitch, tags]
      properties:
        sourcePlaceId:
          type: [string, "null"]
          maxLength: 200
          description: >-
            Public catalog or same-trip place to inherit provider facts from;
            null for manual entry. A foreign trip's private place is reported as
            not found, never loaded before authorization.
        place: { $ref: "#/components/schemas/CandidatePlaceInput" }
        pitch: { type: string, minLength: 1, maxLength: 2000 }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 60 }

    UpdateCandidateInput:
      type: object
      additionalProperties: false
      required: [place, pitch, tags]
      properties:
        place: { $ref: "#/components/schemas/CandidatePlaceInput" }
        pitch: { type: string, minLength: 1, maxLength: 2000 }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 60 }

    StopPatch:
      description: Content-editable fields (§3.3) — everything else is structural.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        plannedArrival:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
          description: '"HH:MM" local.'
        durationMin: { type: integer, minimum: 1, maximum: 1440 }
        notes: { type: string, maxLength: 10000 }
        booking:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/BookingInput"

    DayPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        windowStart:
          { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
        windowEnd:
          { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
        cityHint: { type: string, minLength: 1, maxLength: 120 }

    NoticePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 10000 }
        pinned: { type: boolean }
        sourceUrl:
          type: [string, "null"]
          maxLength: 2048
          pattern: "^https?://"
        status:
          type: string
          enum: [active, resolved, archived]
        audience:
          type: [array, "null"]
          minItems: 1
          maxItems: 90
          uniqueItems: true
          items: { type: string }
          description: >-
            Replace the audience; null = back to the whole group. The server
            removes checklist completion stamps for users excluded by the
            resulting audience; replacement checklist state is not accepted.

    CreateProposalInput:
      type: object
      additionalProperties: false
      required: [title, rationale, changeSet, route]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        rationale: { type: string, maxLength: 4000 }
        changeSet: { $ref: "#/components/schemas/ChangeSet" }
        route: { $ref: "#/components/schemas/ProposalRoute" }

    CreatePollInput:
      type: object
      additionalProperties: false
      description: >-
        Input for a non-structural decision poll. A plan-change poll is created
        only by the proposal workflow and is therefore not expressible here.
      required: [kind, title, description, options, closesAt, allowMulti]
      properties:
        kind: { type: string, const: decision }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        options:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [label]
            properties:
              label: { type: string, minLength: 1, maxLength: 200 }
        closesAt:
          type: string
          format: date-time
          pattern: "(Z|[+-]00:00)$"
          description: UTC instant; non-zero offsets are rejected.
        allowMulti: { type: boolean }

    AddExpenseInput:
      type: object
      additionalProperties: false
      required: [paidBy, amount, currency, category, split, note]
      properties:
        paidBy: { type: string, minLength: 1, maxLength: 200 }
        amount:
          { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
        currency:
          { type: string, pattern: "^[A-Z]{3}$", description: ISO 4217. }
        category: { $ref: "#/components/schemas/ExpenseCategory" }
        split: { $ref: "#/components/schemas/ExpenseSplit" }
        note: { type: string, maxLength: 10000 }
        linkedStopId:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Optional current-plan stop with an existing Booking. The ledger
            transaction owns the booking-side pointer and never invents
            booking details.

    ExpensePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Correctable expense fields. Validation applies to the complete row
        after merging the patch: the payer and participants must be current
        trip members, an exact split must equal the resulting amount, and a
        linked stop must belong to the same trip. `fxRateToBase` is deliberately
        absent because the server owns it.
      properties:
        paidBy:
          { type: string, minLength: 1, maxLength: 200, description: userId }
        amount:
          { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
        currency:
          { type: string, pattern: "^[A-Z]{3}$", description: ISO 4217. }
        category: { $ref: "#/components/schemas/ExpenseCategory" }
        split: { $ref: "#/components/schemas/ExpenseSplit" }
        note: { type: string, maxLength: 10000 }
        linkedStopId:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
          description: >-
            Null clears the stop link; omission leaves it unchanged. A new
            target must be a current-plan stop with an existing Booking.

    AddSettlementInput:
      type: object
      additionalProperties: false
      required: [fromUser, toUser, amount]
      properties:
        fromUser: { type: string, minLength: 1, maxLength: 200 }
        toUser: { type: string, minLength: 1, maxLength: 200 }
        amount:
          {
            type: number,
            exclusiveMinimum: 0,
            maximum: 1000000000,
            description: In trip base currency.,
          }

    CreateNoticeInput:
      type: object
      additionalProperties: false
      required: [category, title, body]
      properties:
        category: { $ref: "#/components/schemas/NoticeCategory" }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 10000 }
        sourceUrl:
          type: string
          maxLength: 2048
          pattern: "^https?://"
        checklistItems:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 500 }
          description: Plain strings; the server assigns ids, empty doneBy, mode each.
        audience:
          type: array
          minItems: 1
          maxItems: 90
          uniqueItems: true
          items: { type: string }
          description: Member userIds this notice concerns; omit for the whole group.

    RegisterServiceIdentityInput:
      type: object
      additionalProperties: false
      required: [name, clientId, scopes, tripIds, ttlHours]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        clientId:
          type: string
          minLength: 39
          maxLength: 39
          pattern: "^[0-9a-f]{32}\\.access$"
          description: Cloudflare service-token client ID/common_name; never the client secret.
        scopes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: "#/components/schemas/ServiceScope" }
        tripIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        ttlHours:
          type: integer
          enum: [1, 8, 24, 168]
