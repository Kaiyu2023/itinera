# Itinera API — the reconciled frontend/backend contract.
#
# Kept in lockstep with frontend/src/api/client.ts + types.ts; route shapes
# follow DESIGN.md §8 and are the implementation target for the Rust API.
# The Rust/axum backend (Phase B) implements THIS file; HttpApiClient is a
# 1:1 mechanical mapping of ApiClient methods onto these operations.
#
# Conventions (mirrors types.ts):
# - ids are opaque strings
# - instants are ISO-8601 UTC strings (2026-11-02T09:30:00Z) — format: date-time
# - local times are "HH:MM" strings interpreted in the day's IANA timezone
# - dates are "YYYY-MM-DD" strings — format: date
# - amounts are numbers in the currency named alongside them
openapi: 3.1.0
info:
  title: Itinera API
  version: 1.0.0
  description: |
    Collaborative trip planning: candidates → versioned plans → two-tier
    governance (leaders approve structural ChangeSets or route them to polls;
    content edits apply immediately with revertible history), plus discussions,
    a multi-currency ledger with debt simplification, prep notices with group
    checklists, and scoped Cloudflare Access service identities whose proposed
    mutations divert into the owner's review queue (the "AI airlock").

    The same Cloudflare Access application-JWT envelope authenticates human and
    service callers. Human assertions carry an email. A service assertion
    carries a `common_name` that must resolve to a pre-created active mapping
    with one human owner, explicit trip IDs, and `read`/`propose` scopes. Itinera
    never mints or accepts a second custom bearer credential. Services cannot
    vote, administer, approve, or call direct mutation routes; proposed changes
    enter the human owner's review queue instead of applying directly.

    Interface localisation is client-owned. The API has no locale parameter or
    preference field and returns user-authored, provider, and editorial content
    exactly as stored; switching between English and Simplified Chinese changes
    UI message-catalogue strings only.

    Every trip-owned child resource stays under `/trips/{tripId}`. Rust uses
    that path value to read authoritative membership before addressing the
    child inside that trip-scoped resource namespace; a child id is never a
    global lookup key or evidence of permission. Caller and actor ids always
    come from the verified principal rather than request JSON. Resource ids
    nested in a request body must also resolve under the route's trip unless
    their schema explicitly identifies a public catalog record. Commands
    validate all such references before writing; a foreign private id is
    reported as not found.
servers:
  - url: https://api.itinera.example
    description: Placeholder — final domain set at deploy time.
security:
  - cfAccessJwt: []
tags:
  - name: identity
  - name: trips
  - name: candidates
  - name: plan
  - name: edits
    description: Content edits — immediate, field-level history, revertible.
  - name: proposals
    description: Structural ChangeSets — leader approval or poll (§3.3).
  - name: polls
  - name: review
    description: The AI airlock — the caller's own review queue (§7).
  - name: discussions
  - name: ledger
  - name: notices
  - name: service-identities

paths:
  /me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Human identity from the validated Access assertion; auto-provisions on first login.
      x-itinera-principal: human-only
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: Card-sized summaries of the caller's trips.
      description: >-
        Deterministically ordered and fail-closed: the array contains at most
        1,000 trips and at most 4 MiB of encoded response data.
      x-itinera-collection-safety-limit: 1000
      x-itinera-response-limit-bytes: 4194304
      responses:
        "200":
          description: Trips the caller belongs to.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items: { $ref: "#/components/schemas/TripSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createTrip
      tags: [trips]
      summary: Create a trip; the caller becomes its first leader.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTripInput" }
      responses:
        "201":
          description: The new trip.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}:
    get:
      operationId: getTrip
      tags: [trips]
      summary: Full trip record, including membership.
      parameters: [{ $ref: "#/components/parameters/tripId" }]
      responses:
        "200":
          description: The trip.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/status:
    patch:
      operationId: setTripStatus
      tags: [trips]
      summary: Change the trip's lifecycle status.
      description: |
        This is an immediate content change, not a structural plan change, so
        it does not require a poll or leader approval. Leaders and members may
        move in either direction through the lifecycle; viewers are read-only.
        The server derives the actor from the authenticated principal and
        records the change in the trip's content history.
      parameters: [{ $ref: "#/components/parameters/tripId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/TripStatus" }
      responses:
        "200":
          description: The trip with its new status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/members:
    get:
      operationId: getUsers
      tags: [trips]
      summary: Member profiles (name/avatar display data).
      description: >-
        Authorization, memberships, and stable profiles come from one
        authoritative read snapshot. The deterministic array fails closed
        above 1,000 profiles or 4 MiB of encoded response data.
      x-itinera-collection-safety-limit: 1000
      x-itinera-response-limit-bytes: 4194304
      parameters: [{ $ref: "#/components/parameters/tripId" }]
      responses:
        "200":
          description: Profiles of every member.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/members/{userId}:
    delete:
      operationId: removeMember
      tags: [trips]
      summary: Remove a trip membership (leader only).
      description: >-
        The membership deletion is the immediate authorization boundary. App-
        wide Access login cleanup is reconciled separately by the step 4
        provider adapter, because an external policy update cannot be made
        atomic with the durable membership transaction and login alone never
        grants trip access.
      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Membership removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/invites:
    post:
      operationId: invite
      tags: [trips]
      summary: Invite by email (leader only) — grants Access login + pending invite (§6).
      parameters: [{ $ref: "#/components/parameters/tripId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 320 }
      responses:
        "201":
          description: The pending invite.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/places/search:
    get:
      operationId: searchPlaces
      tags: [candidates]
      summary: Search the place catalog (PlaceCatalog port, server-side).
      description: |
        Matches the public/provider catalog plus reusable saved places belonging
        to this trip. Candidate-owned copies remain in the candidate picker
        rather than appearing twice unless a plan has adopted them. Private
        snapshots from other trips must never be returned or accepted as
        sourcePlaceId values. Backed by the PlaceCatalog adapter (Google Places
        in prod, fixtures in mock); results are full Place records ready to pin
        on a map. The deterministically de-duplicated result fails closed above
        100 places or 4 MiB of encoded response data.
      x-itinera-collection-safety-limit: 100
      x-itinera-response-limit-bytes: 4194304
      parameters:
        - $ref: "#/components/parameters/tripId"
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: Matching public and reusable same-trip places.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/Place" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: Candidates with their places joined in — no N+1 fetches.
      description: >-
        Deterministically ordered and fail-closed: the joined collection
        contains at most 1,000 candidates and at most 4 MiB of encoded response
        data.
      x-itinera-collection-safety-limit: 1000
      x-itinera-response-limit-bytes: 4194304
      parameters: [{ $ref: "#/components/parameters/tripId" }]
      responses:
        "200":
          description: The trip's candidate shortlist.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items: { $ref: "#/components/schemas/CandidateWithPlace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: addCandidate
      tags: [candidates]
      summary: Add a catalog-backed or manually entered idea to the shortlist.
      description: >-
        Creates a candidate-owned place snapshot. sourcePlaceId supplies the
        immutable catalog/provider facts to inherit; null marks a manual idea.
        The submitted place and guide strings are user-authored content and are
        stored exactly as entered after surrounding-whitespace normalisation.
      parameters: [{ $ref: "#/components/parameters/tripId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddCandidateInput" }
      responses:
        "201":
          description: The new candidate, place joined in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateWithPlace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/candidates/{candidateId}:
    patch:
      operationId: updateCandidate
      tags: [candidates]
      summary: Replace the editable content of a trip idea.
      description: >-
        Applies immediately and records field-level history. The server forks a
        new candidate-owned place snapshot, so a catalog entry or stop already
        adopted by the plan is never rewritten by this operation.
      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - name: candidateId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCandidateInput" }
      responses:
        "200":
          description: The updated candidate, new place snapshot joined in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateWithPlace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/candidates/{candidateId}/status:
    patch:
      operationId: setCandidateStatus
      tags: [candidates]
      summary: Shortlist or pass on an idea without changing the plan.
      description: >-
        Candidate status is immediate rather than governance-gated. in_plan is
        server-owned and can only result from an applied structural proposal.
      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - name: candidateId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/CandidateDisposition" }
      responses:
        "200":
          description: The moved candidate, place joined in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateWithPlace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/plan:
    get:
      operationId: getCurrentPlan
      tags: [plan]
      summary: Everything needed to render map + timeline in one fetch.
      description: The complete validated plan graph fails closed above 4 MiB of encoded response data.
      x-itinera-response-limit-bytes: 4194304
      parameters: [{ $ref: "#/components/parameters/tripId" }]
      responses:
        "200":
          description: The current plan version, denormalised.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: initializePlan
      tags: [plan]
      summary: Bootstrap Plan v1 and its dated Day skeleton from the first trip idea.
      description: >-
        Idempotent. When the trip has no current plan, creates one empty Day for
        every date from startDate through endDate and seeds city/timezone from
        the shortlisted candidate place. This does not adopt the idea; adding
        its stop still requires a structural proposal. If a plan already exists,
        returns that current PlanDetail unchanged. The complete validated plan
        graph fails closed above 4 MiB of encoded response data.
      x-itinera-response-limit-bytes: 4194304
      parameters: [{ $ref: "#/components/parameters/tripId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InitializePlanInput" }
      responses:
        "200":
          description: Existing current plan, or the newly initialised Plan v1.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/plan/versions:
    get:
      operationId: listPlanVersions
      tags: [plan]
      summary: Immutable plan-version metadata history.
      description: >-
        Returns retained immutable plan versions in oldest-first order. This
        endpoint does not return a historical plan graph or perform rollback;
        governed re-adoption is a future API change that would publish a new
        version. The collection fails closed above 1,000 versions or 4 MiB of
        encoded response data.
      x-itinera-collection-safety-limit: 1000
      x-itinera-response-limit-bytes: 4194304
      parameters: [{ $ref: "#/components/parameters/tripId" }]
      responses:
        "200":
          description: All retained plan-version metadata, oldest first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items: { $ref: "#/components/schemas/Plan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/stops/{stopId}:
    patch:
      operationId: updateStop
      tags: [edits]
      summary: Content edit — applies immediately, logged to field-level history.
      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - name: stopId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StopPatch" }
      responses:
        "200":
          description: The updated stop.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stop" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/days/{dayId}:
    patch:
      operationId: updateDay
      tags: [edits]
      summary: Content edit — applies immediately, logged to field-level history.
      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - name: dayId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DayPatch" }
      responses:
        "200":
          description: The updated day.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Day" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/notices/{noticeId}:
    patch:
      operationId: updateNotice
      tags: [notices]
      summary: Author/leader management — content, audience, pin, and lifecycle.
      description: >-
        Applies immediately. A current leader may manage any notice; its author
        may manage it only while they remain a current leader or member. Viewers
        are read-only for notice content. The transaction rechecks that exact
        role and the stored author before writing, and appends one field-level
        content-history event for every changed field. Audience replacement
        validates direct memberships in the same atomic write transaction, and
        removes departed or excluded completion stamps as server-derived state,
        including when null restores the whole group.
        Setting status to archived removes it from active counts but does not
        delete it; setting status back to active restores it.
      x-itinera-author-or-leader: true
      x-itinera-role-rechecked-in-transaction: true
      x-itinera-content-history: field-level
      x-itinera-audience-completion-cleanup: server-derived
      x-itinera-request-body-limit-bytes: 65536
      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - { $ref: "#/components/parameters/noticeId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoticePatch" }
      responses:
        "200":
          description: The updated notice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/history:
    get:
      operationId: getHistory
      tags: [edits]
      summary: Field-level edit log, newest first.
      description: >-
        Every current direct member, including a viewer, may read history. The
        server authorizes from authoritative direct membership in the same read
        snapshot as the audit records; a navigation index result is never
        authority. Only applied and reverted content events are returned;
        pending or rejected review material is not shared history. Reverted
        originals remain in the list beside their compensating edits and
        provenance. Dangling, cyclic, time-reversing, or otherwise inconsistent
        compensation provenance fails closed as corrupt data. This array-shaped
        first slice fails closed at 1,000 records or 4 MiB of encoded
        audit/response data; cursor pagination replaces those ceilings before
        larger histories are supported.
      x-itinera-roles: [leader, member, viewer]
      x-itinera-authorization-read: strongly-consistent-direct-membership
      x-itinera-request-body-limit-bytes: 1024
      x-itinera-response-limit-bytes: 4194304
      x-itinera-history-safety-limit: 1000
      x-itinera-history-safety-bytes: 4194304
      x-itinera-history-statuses: [applied, reverted]
      parameters: [{ $ref: "#/components/parameters/tripId" }]
      responses:
        "200":
          description: The trip's content-edit history.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContentHistoryEdit" }
