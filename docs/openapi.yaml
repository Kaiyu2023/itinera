        Every direct trip member, including viewers, may inspect proposal
        history. The newest-first collection fails closed above 1,000 rows or
        4 MiB of encoded response data.
      x-itinera-roles: [leader, member, viewer]
      x-itinera-collection-safety-limit: 1000
