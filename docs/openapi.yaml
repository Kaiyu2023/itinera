        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createProposal
      tags: [proposals]
      summary: Submit a structural ChangeSet for leader approval or a poll.
      description: |
        Leaders and members may submit. A leader using `leader_approval` is
        fast-pathed: the proposal applies atomically without requiring a second
        approval. A member's proposal remains pending until a leader decides it.

        The `poll` route creates the pending proposal and its server-linked
        `plan_change` poll in one transaction. Neither side can exist alone.
        Service-sourced proposals first enter the human owner's review queue (§7).
