  /trips/{tripId}/edits/{editId}/revert:
    post:
      operationId: revertEdit
      tags: [edits]
      summary: Revert a content edit (writes a compensating edit).
      description: |
        Leaders and members may revert; viewers are read-only. The request has
        no body: the only caller-selected value is the server-issued `editId`
        in this trip-scoped path. The server loads and validates that stored
        audit event, permits only the explicitly listed entity/field pairs,
        verifies the current field still equals the event's `newValue`, and
        atomically rechecks the required role, entity revision and exact current
        entity payload. Notice edits retain their stricter boundary: a current
        editor author may revert their notice, while any other author requires
        a current leader. Success marks the original `reverted` with actor/time
        provenance and appends an `applied` compensating edit; neither history
        row is deleted. Repeating an already successful request returns 204
        without writing another compensation. Stale state and unsupported
        targets return 409. A foreign trip's edit id is indistinguishable from
        a missing id in the route trip. A new compensation is rejected before
        writing when the bounded history is already at 1,000 records or the
        projected encoded history would exceed 4 MiB; an already-reverted edit
        remains an idempotent success at the boundary. Candidate status reverts
        are limited to shortlisted and rejected because in_plan is owned by
        structural proposal application.
      x-itinera-roles: [leader, member]
      x-itinera-role-rechecked-in-transaction: true
      x-itinera-notice-author-or-leader: true
      x-itinera-idempotent: true
      x-itinera-body-limit-bytes: 1024
      x-itinera-history-safety-limit: 1000
      x-itinera-history-safety-bytes: 4194304
      x-itinera-supported-fields:
        trip: [status]
        candidate: [place, pitch, tags, status]
        day: [windowStart, windowEnd, cityHint]
        stop: [plannedArrival, durationMin, notes, booking]
        notice: [title, body, pinned, sourceUrl, status, audience]
      x-itinera-supported-values:
        candidate.status: [shortlisted, rejected]
      parameters:
        - { $ref: "#/components/parameters/tripId" }
        - { $ref: "#/components/parameters/editId" }
      responses:
        "204": { description: Edit reverted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{tripId}/proposals:
    get:
      operationId: listProposals
      tags: [proposals]
      summary: All structural proposals for the trip.
