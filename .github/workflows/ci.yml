# CI for every PR and for main. Four checks:
#   static  — frontend and edge formatting, linting, types, build, and tests
#   e2e     — production build + full Playwright suite (desktop + mobile)
#   backend — cargo fmt + clippy + tests for the Rust workspace
#   infra   — Terraform formatting, schema validation, and mocked module tests
# Every job runs on every PR regardless of which directory changed: a job
# skipped by a paths filter never reports a status, which would leave a
# required check pending forever. Actions minutes are free on public repos.
# The workflow token is read-only; no secrets are used or needed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  static:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            edge/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Install edge dependencies
        working-directory: edge
        run: npm ci
      - name: Check edge formatting
        working-directory: edge
        run: npm run format:check
      - name: Generate Cloudflare runtime types
        working-directory: edge
        run: npm run generate-types
      - name: Type-check edge Worker
        working-directory: edge
        run: npm run typecheck
      - name: Build and test edge request gates
        working-directory: edge
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: frontend/test-results/
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      # No toolchain action: backend/rust-toolchain.toml pins the version, and
      # rustup installs it (with rustfmt + clippy) on the first cargo call.
      - run: cargo --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/rust-toolchain.toml', 'backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo test --all-features

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      # This public job has no AWS credentials and no backend configuration.
      # It must never plan against an environment or apply infrastructure.
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color
      - run: terraform test -no-color
