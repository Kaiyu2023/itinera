[workspace]
resolver = "3"
members = ["crates/core", "crates/adapters", "crates/api"]

[workspace.dependencies]
async-trait = "0.1.91"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["derive", "json", "migrate", "runtime-tokio", "sqlite-bundled"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.19"
url = "2.5.7"
uuid = { version = "1.24.0", features = ["v4"] }
