[package]
name = "itinera-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
itinera-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
async-trait.workspace = true
itinera-adapters = { version = "0.1.0", path = "../adapters", features = ["dev-auth"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
