[package]
name = "itinera-api"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
dev-auth = ["itinera-adapters/dev-auth"]

[dependencies]
axum = "0.8.9"
itinera-adapters = { version = "0.1.0", path = "../adapters" }
itinera-core = { version = "0.1.0", path = "../core" }
lambda_http = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
itinera-adapters = { version = "0.1.0", path = "../adapters", features = ["dev-auth"] }
tower = { version = "0.5.3", features = ["util"] }
